name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: git diff --exit-code -- tripo-model-rotation.user.js dist/tripo-core.min.js dist/tripo-model-rotation.standalone.user.js
      - name: Publish installable scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          tripo-model-rotation.user.js
          dist/tripo-model-rotation.standalone.user.js
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
